<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R390 Studio</title>
<style>
html,body{height:100%;margin:0;background:#202124;color:#e6e8eb;font-family:Segoe UI,Arial,sans-serif}
#boot{height:100%;display:grid;place-items:center}
.card{padding:22px 26px;border:1px solid #444850;border-radius:10px;background:#2b2d32;box-shadow:0 18px 60px rgba(0,0,0,.4);text-align:center}
.spinner{width:28px;height:28px;border:3px solid #4a4d53;border-top-color:#0a84ff;border-radius:50%;margin:0 auto 12px;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
small{display:block;color:#aeb3bc;margin-top:7px}
</style>
</head>
<body>
<div id="boot"><div class="card"><div class="spinner"></div><b>R390 Studio</b><small>Загрузка редактора…</small></div></div>
<script>
(async()=>{
  const parts=["app.b64.part01","app.b64.part02","app.b64.part03","app.b64.part04","app.b64.part05"];
  const texts=await Promise.all(parts.map(async p=>{
    const r=await fetch(p,{cache:"no-store"});
    if(!r.ok)throw new Error("Не удалось загрузить "+p+" ("+r.status+")");
    return (await r.text()).trim();
  }));
  const b64=texts.join("");
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  let html;
  if("DecompressionStream" in window){
    const ds=new DecompressionStream("gzip");
    html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  }else{
    const pako=await import("https://cdn.jsdelivr.net/npm/pako@2.1.0/+esm");
    html=new TextDecoder().decode(pako.ungzip(bytes));
  }
  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  console.error(err);
  document.getElementById("boot").innerHTML='<div class="card"><b>Ошибка загрузки</b><small>'+String(err.message||err)+'</small></div>';
});
</script>
</body>
</html>
